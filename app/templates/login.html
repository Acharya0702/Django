{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'login.css' %}">
    <title>Auth - Login</title>
</head>

<body>
    <div class="container">
        <h1 class="heading">login Page</h1>
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="text" name="username" id="username" placeholder="Enter your user name" required><br><br>
            <input type="password" name="password" id="password" placeholder="Enter your password" required> <br><br>
            <button type="submit" class="btn">Login</button>
            <p>{{error}}</p><br>
            <p>Don't have account
                <a href="{% url 'register' %}">Register here</a>
            </p>
        </form>
    </div>
</body>

</html>
